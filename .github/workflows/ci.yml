name: BunaLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Expo project diagnostics
        run: npx expo-doctor
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android

  validate-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/gemini-grade/index.ts
          deno check supabase/functions/coffee-sync/index.ts
          deno check supabase/functions/chapa-initialize/index.ts
          deno check supabase/functions/chapa-webhook/index.ts
          deno check supabase/functions/certificate-verify/index.ts
          deno check supabase/functions/admin-users/index.ts
